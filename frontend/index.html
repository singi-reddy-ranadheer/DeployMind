<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeployMind — Hindsight-Powered DevOps Agent</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7fb;color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:230px;background:#101827;color:#dce5f3;padding:22px 14px;display:flex;flex-direction:column}.logo{font-size:20px;font-weight:800;padding:8px 10px 24px;color:white}.nav{width:100%;border:0;background:transparent;color:#aebbd0;text-align:left;padding:12px;border-radius:9px;margin:2px 0}.nav:hover,.nav.on{background:#1e2b40;color:white}.grow{flex:1}.main{flex:1;min-width:0}.top{height:72px;background:white;border-bottom:1px solid #e5e8ef;display:flex;align-items:center;padding:0 30px;gap:12px}.top b{font-size:18px}.wrap{max-width:1180px;margin:auto;padding:28px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.hero h1{margin:0 0 5px;font-size:28px}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:white;border:1px solid #e5e8ef;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 2px 8px #10182708}.stat b{font-size:27px;display:block;margin-top:7px}.btn{border:0;background:#2563eb;color:white;padding:10px 15px;border-radius:9px;font-weight:700}.btn.secondary{background:#eef3ff;color:#2456bd}.btn.dark{background:#111827}.btn:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap}.risk{border-left:5px solid #64748b}.risk.high{border-color:#dc2626}.risk.medium{border-color:#d97706}.risk.low{border-color:#16a34a}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:#eef2f7}.pill.high{background:#fee2e2;color:#b91c1c}.pill.medium{background:#ffedd5;color:#c2410c}.pill.low{background:#dcfce7;color:#166534}.memory{background:#f7f5ff;border:1px solid #ded8ff}.field{display:flex;flex-direction:column;gap:6px;margin:13px 0}.field label{font-weight:700}.field input,.field select,.field textarea{border:1px solid #d7dce5;border-radius:8px;padding:10px;background:white}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.check{padding:11px;border:1px solid #e3e7ee;border-radius:8px}.tabs{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap}.tab{border:1px solid #dce2eb;background:white;padding:9px 13px;border-radius:8px}.tab.on{background:#111827;color:white}.chat{min-height:250px}.msg{max-width:850px;padding:12px 14px;border-radius:12px;margin:9px 0}.msg.user{margin-left:auto;background:#eaf1ff}.msg.agent{background:#f0f3f7}.small{font-size:12px}.notice{padding:10px 12px;border-radius:8px;background:#fff7ed;color:#9a3412;margin:10px 0}.success{background:#ecfdf3;color:#166534}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #edf0f4}.mono{font-family:ui-monospace,monospace}.hidden{display:none}@media(max-width:800px){.side{display:none}.grid{grid-template-columns:1fr 1fr}.wrap{padding:18px}.hero{align-items:flex-start;flex-direction:column}.checks{grid-template-columns:1fr}}
</style></head>
<body><div class="app">
<aside class="side"><div class="logo">🧠 DeployMind</div>
<button class="nav on" data-page="overview">🏠 Overview</button><button class="nav" data-page="new">🚀 New Deployment</button><button class="nav" data-page="history">📜 Deployment History</button><button class="nav" data-page="ask">💬 Ask Agent</button>
<div class="grow"></div><div class="small">Hindsight-powered DevOps memory</div></aside>
<main class="main"><header class="top"><div><div class="small muted">MICROSOFT • Hack With Hyderabad 3.0</div><b>DeployMind — Deployment Intelligence</b></div><div class="grow"></div><span id="conn" class="pill">Memory: demo fallback</span></header>
<div class="wrap"><div id="view"></div></div></main></div>
<script>
const API=(localStorage.getItem('deploymind_api')||'').replace(/\/$/,'');
let memories=JSON.parse(localStorage.getItem('deploymind_memories')||'[]');
let current=null,analysis=null;
const demo=[{id:'D042',app:'Payment API',version:'v2.4.1',env:'Production',change:'PostgreSQL 14 → 16 + driver update',status:'failed',risk:'high',cause:'Database driver was incompatible with PostgreSQL 16.',fix:'Rolled back and updated the driver.',lesson:'Verify driver compatibility before PostgreSQL major upgrades.',date:'Sep 26'},{id:'D041',app:'Auth Service',version:'v1.8.0',env:'Staging',change:'Redis upgrade',status:'success',risk:'low',cause:'',fix:'',lesson:'Run cache compatibility tests before production.',date:'Sep 25'}];
function all(){return [...memories,...demo]} function nav(p){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x.dataset.page===p)); render(p)}
document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>nav(x.dataset.page));
function render(p='overview'){
 if(p==='overview')return overview(); if(p==='new')return form(); if(p==='history')return history(); if(p==='learn')return learn(); ask();
}
function overview(){let a=all();view.innerHTML=`
<div class="hero"><div><h1>Good evening 👋</h1><div class="muted">Check your next deployment against what your team has learned from previous deployments.</div></div><button class="btn" onclick="nav('new')">+ New Deployment</button></div>
<div class="grid"><div class="card stat">📦 Total Deployments<b>${42+memories.length}</b></div><div class="card stat">✅ Successful<b>${34+memories.filter(x=>x.status==='success').length}</b></div><div class="card stat">❌ Failed<b>${8+memories.filter(x=>x.status==='failed').length}</b></div><div class="card stat">⚠️ High-Risk Detected<b>${5+memories.filter(x=>x.risk==='high').length}</b></div></div>
<div class="card memory"><h2>🧠 What the agent learned recently</h2><p><b>PostgreSQL upgrades</b></p><p class="muted">A previous PostgreSQL upgrade failed because of database-driver compatibility. DeployMind keeps this experience in Hindsight and uses it when similar changes appear.</p><button class="btn secondary" onclick="nav('new')">Test a Similar Deployment</button></div>
<div class="card"><h2>Recent Deployments</h2><table class="table"><thead><tr><th>ID</th><th>Application</th><th>Change</th><th>Status</th><th>Risk</th></tr></thead><tbody>${a.slice(0,5).map(row).join('')}</tbody></table></div>`;}
function row(x){return `<tr><td class="mono">${x.id}</td><td>${x.app}</td><td>${x.change}</td><td><span class="pill">${x.status}</span></td><td><span class="pill ${x.risk||''}">${x.risk||'—'}</span></td></tr>`}
function form(){view.innerHTML=`
<div class="hero"><div><h1>Analyze New Deployment</h1><div class="muted">Recall → decide → explain. The outcome can then be retained as organizational memory.</div></div><span class="pill">🧠 Hindsight Memory</span></div>
<div class="card"><div class="field"><label>Application</label><select id="app"><option>Payment API</option><option>Auth Service</option><option>User Service</option><option>Notification Service</option></select></div>
<div class="grid"><div class="field"><label>Version</label><input id="ver" value="v2.5.0"></div><div class="field"><label>Environment</label><select id="env"><option>Production</option><option>Staging</option><option>Development</option></select></div></div>
<div class="field"><label>Change description</label><textarea id="desc" rows="3">PostgreSQL upgraded from version 14 to 16 and the database driver was updated.</textarea></div>
<div class="grid"><div class="field"><label>Database version</label><input id="db" value="PostgreSQL 16"></div><div class="field"><label>Database driver</label><input id="driver" value="pg-driver 4.2"></div></div>
<div class="field"><label>Other changes</label><input id="other" value="Updated database container and connection pool configuration"></div>
<button class="btn" onclick="analyze()">🔍 Analyze with Memory</button></div>
<div id="result"></div>`;}
async function analyze(){
 const d={application:app.value,version:ver.value,environment:env.value,description:desc.value,changes:{database:db.value,driver:driver.value,dependencies:other.value,infrastructure:other.value,configuration:other.value,api:''},rollback:'v2.4.1'};
 result.innerHTML='<div class="card"><b>Searching deployment memory…</b><p class="muted">Recalling similar incidents and evaluating the change.</p></div>';
 if(API){try{let r=await fetch(API+'/deployments/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw Error();analysis=await r.json();document.getElementById('conn').textContent='Memory: Hindsight connected';document.getElementById('conn').className='pill low';showAnalysis(d,analysis,true);return}catch(e){document.getElementById('conn').textContent='Memory: demo fallback'}}
 const hits=all().filter(x=>(x.change+' '+x.cause+' '+x.lesson).toLowerCase().includes('postgres')||d.description.toLowerCase().includes('postgres')).slice(0,4);
 const failed=hits.filter(x=>x.status==='failed');analysis={risk:failed.length?'HIGH':hits.length?'MEDIUM':'LOW',headline:failed.length?'Similar failure found in deployment memory.':hits.length?'Related deployment memory found.':'No similar deployment memory found.',why:failed.length?'A previous PostgreSQL upgrade failed because of driver compatibility. Verify the driver before deploying.':'No matching failure was found in the demo memory.',checks:['Verify database driver compatibility','Run migration tests in staging','Keep rollback version ready'],hits:hits.map(x=>({memory:x,shared:['postgres']}))};
 showAnalysis(d,analysis,false);
}
function showAnalysis(d,a,live){current=d;let hits=(a.memories||a.hits||[]).map(h=>h.memory||h);document.getElementById('result').innerHTML=`
<div class="card risk ${String(a.risk||'LOW').toLowerCase()}"><h2>Deployment Risk: <span class="pill ${String(a.risk||'low').toLowerCase()}">${a.risk}</span></h2><h3>${a.headline||'Analysis complete'}</h3><p>${a.reasoning||a.why||a.explanation||'The decision layer found no blocking evidence.'}</p><h3>Recommended safeguards</h3><div class="checks">${(a.recommendations||a.checks||[]).map(x=>'<div class="check">✓ '+x+'</div>').join('')}</div><hr><h3>🧠 Retrieved Hindsight Memories (${hits.length})</h3>${hits.map(x=>'<div class="card memory"><b>'+(x.id||'Hindsight memory')+(x.app?' • '+x.app:'')+'</b><p>'+(x.change||x.text||'Retrieved deployment experience')+'</p><p class="muted">'+(x.cause||x.lesson||x.text||'No recorded failure')+'</p></div>').join('')||'<p class="muted">No matching experience found.</p>'}
<button class="btn" onclick="nav('learn')">Simulate Deployment & Record Outcome</button></div>`;}
function learn(){view.innerHTML=`
<div class="hero"><div><h1>Help the agent learn</h1><div class="muted">Every deployment becomes experience that can help with future deployments.</div></div></div>
<div class="card"><h2>How did this deployment go?</h2><div class="actions"><button class="btn" onclick="saveLearn('failed')">🔴 Failed</button><button class="btn secondary" onclick="saveLearn('success')">🟢 Successful</button></div>
<div class="field"><label>Root cause / outcome</label><textarea id="cause" rows="3">Database driver was incompatible with PostgreSQL 16.</textarea></div><div class="field"><label>Resolution</label><textarea id="fix" rows="2">Rolled back, updated the driver, and verified compatibility in staging.</textarea></div><div class="field"><label>Lesson learned</label><textarea id="lesson" rows="2">Always verify database-driver compatibility before a PostgreSQL major-version upgrade.</textarea></div></div>`;}
async function saveLearn(status){
 let payload={deployment:{application:current.application,version:current.version,environment:current.environment,description:current.description,changes:{database:(current.changes&&current.changes.database)||'',driver:(current.changes&&current.changes.driver)||'',dependencies:(current.changes&&current.changes.dependencies)||'',infrastructure:(current.changes&&current.changes.infrastructure)||'',configuration:(current.changes&&current.changes.configuration)||'',api:(current.changes&&current.changes.api)||''},rollback:'v2.4.1'},status,root_cause:cause.value,resolution:fix.value,impact:'Moderate',downstream_effects:'Deployment rollback and temporary downtime',lessons:lesson.value,notes:'Captured through DeployMind demo'};
 if(API){try{let r=await fetch(API+'/deployments/learn',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw Error();document.getElementById('conn').textContent='Memory: Hindsight connected';document.getElementById('conn').className='pill low'}catch(e){}}
 let rec={id:'D'+String(43+memories.length).padStart(3,'0'),app:current.application,version:current.version,env:current.environment,change:current.description,status,risk:status==='failed'?'high':'low',cause:cause.value,fix:fix.value,lesson:lesson.value,date:'Today'};memories.unshift(rec);localStorage.setItem('deploymind_memories',JSON.stringify(memories));view.innerHTML='<div class="card success"><h1>✓ Experience Saved</h1><p>DeployMind will use this experience when analyzing future deployments.</p><p><b>Memory:</b> '+rec.lesson+'</p><button class="btn" onclick="nav(\'new\')">Analyze Similar Deployment</button></div>';}
function history(){view.innerHTML='<div class="hero"><div><h1>Deployment History</h1><div class="muted">Review previous deployments and what the agent learned.</div></div></div><div class="card"><table class="table"><thead><tr><th>ID</th><th>Application</th><th>Version</th><th>Change</th><th>Status</th><th>Risk</th></tr></thead><tbody>'+all().map(row).join('')+'</tbody></table></div>'}
function ask(){view.innerHTML='<div class="hero"><div><h1>Ask DeployMind</h1><div class="muted">Ask about previous deployment experiences.</div></div></div><div class="card"><div class="actions"><button class="tab" onclick="askQ(\'Have we had problems with PostgreSQL upgrades?\')">PostgreSQL failures?</button><button class="tab" onclick="askQ(\'What caused previous deployment failures?\')">Previous failures?</button></div><div id="chat" class="chat"></div><div class="field"><input id="q" placeholder="Ask about Redis, database drivers, APIs…"><button class="btn" onclick="askQ(q.value)">Ask</button></div></div>'}
function askQ(qv){if(!qv)return;let hits=all().filter(x=>(x.change+' '+x.cause+' '+x.lesson+' '+x.app).toLowerCase().includes(qv.toLowerCase().split(/\s+/).find(w=>w.length>4)?.replace(/[^a-z0-9]/gi,'')||'postgres'));chat.innerHTML+='<div class="msg user">'+qv+'</div><div class="msg agent"><b>DeployMind:</b> '+(hits.length?'I found '+hits.length+' relevant deployment memory entries. '+hits.slice(0,2).map(x=>x.id+' — '+(x.lesson||x.cause||x.change)).join(' | '):'No matching deployment memory found yet. Record an outcome so the agent can learn.')+'</div>'}
function init(){view=document.getElementById('view');render('overview')} init();
</script></body></html>
